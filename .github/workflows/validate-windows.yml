name: Validate Windows Build

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-windows:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install

      - name: Check frontend JavaScript
        shell: pwsh
        run: |
          Get-ChildItem frontend -Filter *.js | ForEach-Object { node --check $_.FullName }

      - name: Compile Noctem Locus
        run: npm run build -- --no-bundle
