name: Validate Windows Build

on:
  push:
    branches:
      - v0.9.1-native-data
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-windows:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install

      - name: Check native bridge JavaScript
        run: node --check frontend/native-bridge.js

      - name: Compile Noctem Locus
        run: npm run build -- --no-bundle
