name: Apply v0.10 Planner Refinements

on:
  push:
    branches:
      - v0.10-observing-planner
    paths:
      - .github/workflows/apply-v010-refinements.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Apply planner refinements
        run: node scripts/fix-v010-planner.mjs
      - name: Commit planner refinements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/planner.js
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "Refine v0.10 planner session and horizon timing"
          git push
