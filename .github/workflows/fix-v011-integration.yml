name: Fix v0.11 Integration

on:
  push:
    branches:
      - v0.11-catalog-sky
    paths:
      - .github/workflows/fix-v011-integration.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply integration fixes
        run: |
          node scripts/fix-v011-integration.mjs
          node -e "const fs=require('fs');const p='frontend/sky-render-v011.js';let s=fs.readFileSync(p,'utf8');s=s.replaceAll('if(o.mag>magLimit())break;','if(o.mag>magLimit()&&o.key!==skyMapSelectedKey)continue;').replaceAll('if(o.mag>lim)break;','if(o.mag>lim&&o.key!==skyMapSelectedKey)continue;');fs.writeFileSync(p,s)"
      - name: Fast validation
        run: |
          for file in frontend/*.js; do node --check "$file"; done
          node scripts/check-catalog-v011.mjs
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/planner.js frontend/catalog-ui-v011.js frontend/sky-render-v011.js
          git commit -m "Integrate v0.11 catalog with planner and saved horizons"
          git push
