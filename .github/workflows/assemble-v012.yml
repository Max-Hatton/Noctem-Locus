name: Assemble v0.12 Weather Integration

on:
  push:
    branches:
      - v0.12-weather-alerts
    paths:
      - .github/workflows/assemble-v012.yml

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch v0.12 integration points
        run: python3 scripts/integrate-v012.py
      - name: Fast syntax validation
        run: |
          node --check frontend/weather-v012.js
          node --check frontend/native-bridge.js
          node --check frontend/planner.js
      - name: Commit assembled integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/native-bridge.js frontend/planner.js src-tauri/src/lib.rs
          git commit -m "Integrate v0.12 weather with Planner and native notifications"
          git push
