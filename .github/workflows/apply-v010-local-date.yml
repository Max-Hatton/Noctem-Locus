name: Apply v0.10 Local Date Fix

on:
  push:
    branches:
      - v0.10-observing-planner
    paths:
      - .github/workflows/apply-v010-local-date.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Apply local-date fix
        run: node scripts/fix-v010-local-date.mjs
      - name: Commit local-date fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/planner.js
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "Use local calendar dates in v0.10 planner"
          git push
