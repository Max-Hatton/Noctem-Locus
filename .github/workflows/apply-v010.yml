name: Apply v0.10 Wiring

on:
  push:
    branches:
      - v0.10-observing-planner
    paths:
      - .github/workflows/apply-v010.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Apply v0.10 native bridge wiring
        run: node scripts/apply-v010.mjs
      - name: Commit generated bridge update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/native-bridge.js
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "Wire v0.10 planner into native shell"
          git push
