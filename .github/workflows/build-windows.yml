name: Build Windows Release

on:
  push:
    branches:
      - main
    paths:
      - package.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify imported source exists
        id: source
        shell: pwsh
        run: |
          if (Test-Path "frontend/index.html") {
            "ready=true" >> $env:GITHUB_OUTPUT
          } else {
            "ready=false" >> $env:GITHUB_OUTPUT
            Write-Host "Full project source has not been imported yet; skipping build."
          }

      - name: Set up Node.js 24
        if: steps.source.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Rust stable
        if: steps.source.outputs.ready == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Install build dependencies
        if: steps.source.outputs.ready == 'true'
        run: npm install

      - name: Validate frontend and Moon Map
        if: steps.source.outputs.ready == 'true'
        run: npm test

      - name: Build and publish release
        if: steps.source.outputs.ready == 'true'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Noctem Locus v__VERSION__
          releaseBody: |
            Moon Map adds an offline lunar surface atlas, 9,086 named features, phase shading, and a calibrated Dobsonian view that follows the Moon's orientation over time.

            Open Moon Map directly beneath Sky Map. Includes the Orion XT8 IntelliScope profile, eyepiece field controls, feature search, pan, zoom, and night mode.

            Download the Windows setup executable from the assets below.

            Terrain shadows come from the reference mosaic; phase shading models the lunar day/night boundary. Match the map to your eyepiece once and adjust again if your viewing posture changes.

            Current beta installers are unsigned and Windows may show an unknown-publisher warning.
          releaseDraft: false
          prerelease: true
