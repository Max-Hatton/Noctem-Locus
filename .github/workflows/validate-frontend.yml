name: Fast Frontend Checks

on:
  push:
    branches:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check frontend and Moon Map
        run: npm test
