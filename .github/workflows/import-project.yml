name: Import Noctem Locus Project Bundle

on:
  push:
    branches:
      - main
    paths:
      - Noctem-Locus-GitHub-Import.zip

permissions:
  contents: write

jobs:
  import-build-release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Expand project bundle
        shell: pwsh
        run: |
          Remove-Item .noctem-import -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path .noctem-import | Out-Null
          Expand-Archive -Path Noctem-Locus-GitHub-Import.zip -DestinationPath .noctem-import -Force
          Get-ChildItem .noctem-import -Force | ForEach-Object {
            Copy-Item $_.FullName -Destination . -Recurse -Force
          }
          Remove-Item .noctem-import -Recurse -Force
          Remove-Item Noctem-Locus-GitHub-Import.zip -Force

      - name: Commit imported project
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to import."
          else
            git commit -m "Import full Noctem Locus project history"
            git push
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install build dependencies
        run: npm install

      - name: Build and publish Noctem Locus v0.9.0
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v0.9.0
          releaseName: Noctem Locus v0.9.0
          releaseBody: |
            First native Windows beta release of Noctem Locus.

            Includes the current offline astronomy application, All-Sky and Horizon View maps, Push-To, two-star alignment, equipment profiles, observation logging, and photo attachments.

            The installer is currently unsigned, so Windows may show an unknown-publisher warning.
          releaseDraft: false
          prerelease: true
