[package]
name = "noctem-locus"
version = "0.9.0"
description = "Offline astronomy and telescope companion"
authors = ["Noctem Locus"]
edition = "2021"

[lib]
name = "noctem_locus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
