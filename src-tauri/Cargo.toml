[package]
name = "noctem-locus"
version = "0.12.0"
description = "Offline astronomy and telescope companion"
authors = ["Noctem Locus"]
edition = "2021"

[lib]
name = "noctem_locus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
zip = "8.6.0"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
