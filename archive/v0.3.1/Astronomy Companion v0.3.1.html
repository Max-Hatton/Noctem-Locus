const DEG = Math.PI / 180;

    'Moon',
    'Mercury',

    'Saturn',
    'Uranus',

function eccentricAnomalyDeg(Mdeg, e) {

            + 0.023 * sinDeg(2 * Mj - 3 * Ms + 52)

            - 0.229 * cosDeg(2 * Mj - 4 * Ms - 2)
            + 0.119 * sinDeg(Mj - 2 * Ms - 3)
            + 0.046 * sinDeg(2 * Mj - 6 * Ms - 69)
            + 0.014 * sinDeg(Mj - 3 * Ms + 32);

            + 0.018 * sinDeg(2 * Mj - 6 * Ms - 49);

            + 0.035 * sinDeg(Ms - 3 * Mu + 33)
            - 0.015 * sinDeg(Mj - Mu + 20);

function moonEcliptic(d) {
    const mel = moonElements(d);
    const base = orbitVector(mel);
    const sel = sunElements(d);
    const Ms = sel.M;
    const Mm = mel.M;
    const Ls = normalizeDegrees(sel.M + sel.w);
    const Lm = normalizeDegrees(mel.M + mel.w + mel.N);

    const F = normalizeSignedDegrees(Lm - mel.N);

        - 1.274 * sinDeg(Mm - 2 * D)
        + 0.658 * sinDeg(2 * D)
        - 0.186 * sinDeg(Ms)
        - 0.059 * sinDeg(2 * Mm - 2 * D)
        - 0.057 * sinDeg(Mm - 2 * D + Ms)
        + 0.053 * sinDeg(Mm + 2 * D)
        + 0.046 * sinDeg(2 * D - Ms)
        + 0.041 * sinDeg(Mm - Ms)
        - 0.035 * sinDeg(D)
        - 0.031 * sinDeg(Mm + Ms)
        - 0.015 * sinDeg(2 * F - 2 * D)
        + 0.011 * sinDeg(Mm - 4 * D);

        - 0.173 * sinDeg(F - 2 * D)
        - 0.055 * sinDeg(Mm - F - 2 * D)
        - 0.046 * sinDeg(Mm + F - 2 * D)
        + 0.033 * sinDeg(F + 2 * D)
        + 0.017 * sinDeg(2 * Mm + F);

    const sun = sunEcliptic(d);
    const x = helio.x + sun.x;
    const y = helio.y + sun.y;

        body,
        date,

    else if (elongation < 157.5)

    else if (elongation < 202.5)

    else if (elongation < 247.5)

}
function compassDirection(azimuthDeg) {
    const dirs = ['N', 'NNE', 'NE', 'ENE', 'E', 'ESE', 'SE', 'SSE', 'S', 'SSW', 'SW', 'WSW', 'W', 'WNW', 'NW', 'NNW'];
    return dirs[Math.round(normalizeDegrees(azimuthDeg) / 22.5) % 16];
}
function altitudeLabel(altitudeDeg) {
    if (altitudeDeg >= 60)
        return 'Very high';
    if (altitudeDeg >= 35)
        return 'High';
    if (altitudeDeg >= 20)
        return 'Good';
    if (altitudeDeg >= 10)
        return 'Low';
    if (altitudeDeg >= 0)
        return 'Very low';
    return 'Below horizon';
}
/**
 * Finds the next crossing of a requested altitude by scanning and then
 * binary-refining the crossing. direction=+1 is rising, direction=-1 is setting.
 */
function findNextAltitudeCrossing(body, observer, start, targetAltitudeDeg, direction, searchHours = 48) {
    const stepMs = 5 * 60000;
    const endMs = start.getTime() + searchHours * 3600000;
    let t0 = start.getTime();
    let y0 = getBodyPosition(body, observer, new Date(t0)).altitudeDeg - targetAltitudeDeg;
    for (let t1 = t0 + stepMs; t1 <= endMs; t1 += stepMs) {
        const y1 = getBodyPosition(body, observer, new Date(t1)).altitudeDeg - targetAltitudeDeg;
        const crossed = direction === 1 ? (y0 < 0 && y1 >= 0) : (y0 >= 0 && y1 < 0);
        if (crossed) {
            let lo = t0;
            let hi = t1;
            for (let i = 0; i < 24; i += 1) {
                const mid = (lo + hi) / 2;
                const yMid = getBodyPosition(body, observer, new Date(mid)).altitudeDeg - targetAltitudeDeg;
                if (direction === 1) {
                    if (yMid >= 0)
                        hi = mid;
                    else
                        lo = mid;
                }
                else {
                    if (yMid < 0)
                        hi = mid;
                    else
                        lo = mid;
                }
            }
            const time = new Date((lo + hi) / 2);
            return { time, altitudeDeg: getBodyPosition(body, observer, time).altitudeDeg };
        }
        t0 = t1;
        y0 = y1;
    }
    return null;
}
function apparentHorizonAltitude(body) {
    // Approximate standard refraction at the horizon is 34 arcminutes.
    // For the Sun/Moon, include about 16 arcminutes of apparent radius so
    // rise/set refers roughly to the first/last visible limb rather than center.
    return body === 'Sun' || body === 'Moon' ? -0.833 : -(34 / 60);
}
function findNextRise(body, observer, start = new Date()) {
    return findNextAltitudeCrossing(body, observer, start, apparentHorizonAltitude(body), 1, 48);
}
function findNextSet(body, observer, start = new Date()) {
    return findNextAltitudeCrossing(body, observer, start, apparentHorizonAltitude(body), -1, 48);
}
function findNextAstronomicalDusk(observer, start = new Date()) {
    return findNextAltitudeCrossing('Sun', observer, start, -18, -1, 48);
}
function findNextAstronomicalDawn(observer, start = new Date()) {
    return findNextAltitudeCrossing('Sun', observer, start, -18, 1, 48);
}
function angularSeparationDeg(a, b) {
    const ra1 = a.raHours * 15 * DEG;
    const ra2 = b.raHours * 15 * DEG;
    const d1 = a.decDeg * DEG;
    const d2 = b.decDeg * DEG;
    const cosSep = Math.sin(d1) * Math.sin(d2) + Math.cos(d1) * Math.cos(d2) * Math.cos(ra1 - ra2);
    return Math.acos(Math.max(-1, Math.min(1, cosSep))) * RAD;
}


const PAGES=['Tonight','Find Object','Equipment','Observations','Settings'];
const DEFAULT_SETTINGS={theme:'night',brightness:45,locationName:'',latitude:'',longitude:'',elevationM:'0'};
let settings=loadSettings(); let page='Tonight'; let selectedBody='Saturn'; let tickTimer=null;
function loadSettings(){try{return {...DEFAULT_SETTINGS,...JSON.parse(localStorage.getItem('astro.settings')||'{}')}}catch{return {...DEFAULT_SETTINGS}}}
function saveSettings(){localStorage.setItem('astro.settings',JSON.stringify(settings));applyTheme()}
function parseObserver(){if(String(settings.latitude).trim()===''||String(settings.longitude).trim()==='')return null;const latitude=Number(settings.latitude),longitude=Number(settings.longitude),elevationM=Number(settings.elevationM||0);if(!Number.isFinite(latitude)||latitude<-90||latitude>90||!Number.isFinite(longitude)||longitude<-180||longitude>180)return null;return{latitude,longitude,elevationM:Number.isFinite(elevationM)?elevationM:0}}
function applyTheme(){const app=document.getElementById('app');app.className='app '+settings.theme;document.getElementById('brightnessOverlay').style.opacity=String(1-Math.max(5,Math.min(100,settings.brightness))/100);const br=document.getElementById('brightnessRange');if(br)br.value=settings.brightness;const bl=document.getElementById('brightnessLabel');if(bl)bl.textContent=settings.brightness+'%';const tog=document.getElementById('nightToggle');if(tog)tog.textContent=settings.theme==='night'?'ON':'OFF'}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function fmtTime(d){return new Intl.DateTimeFormat(undefined,{hour:'numeric',minute:'2-digit'}).format(d)}
function fmtDate(d){return new Intl.DateTimeFormat(undefined,{weekday:'short',month:'short',day:'numeric'}).format(d)}
function relativeTime(target,now){const min=Math.round((target-now)/60000);if(min<1)return'now';const h=Math.floor(min/60),m=min%60;return h?`in ${h}h ${m}m`:`in ${m}m`}
function fmtEvent(target,now){return target.toDateString()===now.toDateString()?`${fmtTime(target)} · ${relativeTime(target,now)}`:`${fmtDate(target)} ${fmtTime(target)}`}
function fmtRA(hours){const h=Math.floor(hours),mf=(hours-h)*60,m=Math.floor(mf),s=Math.round((mf-m)*60);return`${h}h ${m}m ${s}s`}
function fmtSigned(deg){const sign=deg>=0?'+':'−',v=Math.abs(deg),d=Math.floor(v),m=Math.round((v-d)*60);return`${sign}${d}° ${m}′`}
function skyState(a){if(a>=0)return'Daylight right now.';if(a>=-6)return'Civil twilight.';if(a>=-12)return'Nautical twilight.';if(a>=-18)return'Astronomical twilight.';return'The sky is astronomically dark.'}
function aiming(a,z){if(a<0)return`Wait for it to rise; its bearing is currently ${compassDirection(z)}.`;return`Face ${compassDirection(z)} (${z.toFixed(0)}°) and aim ${a.toFixed(0)}° above the horizon.`}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
function renderShell(){document.getElementById('app').innerHTML=`<div class="shell"><aside class="sidebar"><div class="brand"><div class="brandMark">✦</div><div><h1>Astronomy Companion</h1><p>Desktop astronomy v0.3</p><span class="desktopBadge">● Offline portable build</span></div></div><nav>${PAGES.map(p=>`<button class="navButton ${page===p?'active':''}" data-page="${p}">${p}</button>`).join('')}</nav><div class="nightControls"><div class="controlRow"><span>Night vision</span><button id="nightToggle" class="toggle">${settings.theme==='night'?'ON':'OFF'}</button></div><label>App brightness <strong id="brightnessLabel">${settings.brightness}%</strong><input id="brightnessRange" type="range" min="5" max="100" value="${settings.brightness}"></label><button id="deepNight" class="deepNight">Deep Night</button><div class="mutedText">Shortcut: <span class="kbd">N</span> toggles night mode</div></div></aside><main class="content"><header class="topbar"><div><p class="eyebrow">OFFLINE-FIRST OBSERVING TOOL</p><h2>${page}</h2></div><div class="status"><span class="statusDot"></span>${parseObserver()?esc(settings.locationName||'Location set'):'Location needed'}</div></header><div id="page"></div></main></div><div id="brightnessOverlay" class="brightnessOverlay"></div><div id="toast" class="toast"></div>`;bindShell();applyTheme();renderPage()}
function bindShell(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;renderShell()});document.getElementById('nightToggle').onclick=()=>{settings.theme=settings.theme==='night'?'day':'night';saveSettings();renderShell()};document.getElementById('brightnessRange').oninput=e=>{settings.brightness=Number(e.target.value);saveSettings();applyTheme()};document.getElementById('deepNight').onclick=()=>{settings.theme='night';settings.brightness=12;saveSettings();renderShell()}}
function renderPage(){clearInterval(tickTimer);if(page==='Tonight')renderTonight();else if(page==='Find Object')renderFinder();else if(page==='Settings')renderSettings();else renderPlaceholder(page);if(page==='Tonight'||page==='Find Object')tickTimer=setInterval(()=>renderPage(),30000)}
function locationRequired(){document.getElementById('page').innerHTML=`<section class="placeholder"><div class="orbit">◎</div><h3>Set an observing location first</h3><p>Altitude, azimuth, rise/set times, and darkness all depend on where the telescope is on Earth.</p><button class="primaryButton" id="goSettings">Open Settings</button></section>`;document.getElementById('goSettings').onclick=()=>{page='Settings';renderShell()}}
function renderTonight(){const observer=parseObserver();if(!observer)return locationRequired();const now=new Date(),moon=getBodyPosition('Moon',observer,now),sun=getBodyPosition('Sun',observer,now),phase=getMoonPhase(now),planets=['Mercury','Venus','Mars','Jupiter','Saturn','Uranus','Neptune'].map(b=>getBodyPosition(b,observer,now)).sort((a,b)=>b.altitudeDeg-a.altitudeDeg);const sunset=findNextSet('Sun',observer,now),dark=sun.altitudeDeg<-18?findNextAstronomicalDawn(observer,now):findNextAstronomicalDusk(observer,now);document.getElementById('page').innerHTML=`<section class="pageStack"><article class="heroCard"><div class="heroTopline"><div><p class="eyebrow">LIVE SKY · ${esc(settings.locationName||`${observer.latitude.toFixed(3)}°, ${observer.longitude.toFixed(3)}°`)}</p><h3>${skyState(sun.altitudeDeg)}</h3></div><div class="clockBlock"><strong>${fmtTime(now)}</strong><span>${fmtDate(now)}</span></div></div><p class="heroBody">All positions on this screen are calculated locally on this computer. No internet lookup is required.</p></article><div class="summaryGrid">${summaryCard('Moon',`${Math.round(phase.illuminatedFraction*100)}%`,`${phase.name} · ${moon.altitudeDeg.toFixed(1)}° ${altitudeLabel(moon.altitudeDeg).toLowerCase()}`)}${summaryCard('Sunset',sunset?fmtTime(sunset.time):'—',sunset?relativeTime(sunset.time,now):'No crossing found in 48 h')}${summaryCard(sun.altitudeDeg<-18?'Astronomical dawn':'Astronomical dark',dark?fmtTime(dark.time):'—',sun.altitudeDeg<-18?'Dark sky now':`Sun ${sun.altitudeDeg.toFixed(1)}° altitude`)}</div><section class="panel"><div class="panelHeader"><div><p class="eyebrow">SOLAR SYSTEM</p><h3>What is up right now</h3></div><span class="mutedText">Geometric altitude</span></div><div class="targetTable">${planets.map(p=>`<div class="targetRow"><div class="targetName"><strong>${p.body}</strong><span>${altitudeLabel(p.altitudeDeg)}</span></div><div class="targetMetric"><span>Altitude</span><strong>${p.altitudeDeg.toFixed(1)}°</strong></div><div class="targetMetric"><span>Direction</span><strong>${compassDirection(p.azimuthDeg)} ${p.azimuthDeg.toFixed(0)}°</strong></div><div class="horizonPill ${p.altitudeDeg>=0?'up':'down'}">${p.altitudeDeg>=0?'Above horizon':'Below horizon'}</div></div>`).join('')}</div></section></section>`}
function summaryCard(label,value,detail){return`<article class="card"><span class="cardLabel">${label}</span><strong>${value}</strong><small>${detail}</small></article>`}
function detailCard(label,value){return`<article class="detailCard"><span>${label}</span><strong>${value}</strong></article>`}
function renderFinder(){const observer=parseObserver();if(!observer)return locationRequired();const now=new Date(),p=getBodyPosition(selectedBody,observer,now),moonKm=moonDistanceKm(p),rise=findNextRise(selectedBody,observer,now),set=findNextSet(selectedBody,observer,now),twenty=p.altitudeDeg>=20?null:findNextAltitudeCrossing(selectedBody,observer,now,20,1,72);document.getElementById('page').innerHTML=`<section class="pageStack"><div class="finderBar"><label><span>Object</span><select id="bodySelect">${SOLAR_SYSTEM_BODIES.map(b=>`<option ${b===selectedBody?'selected':''}>${b}</option>`).join('')}</select></label><div class="finderNow"><span>Calculated for</span><strong>${fmtTime(now)}</strong></div></div><article class="objectHero"><div><p class="eyebrow">CURRENT POINTING</p><h3>${selectedBody}</h3><p class="objectStatus">${p.altitudeDeg>=0?`${altitudeLabel(p.altitudeDeg)} in the ${compassDirection(p.azimuthDeg)}`:'Currently below your horizon'}</p></div><div class="pointingReadout"><div><span>ALT</span><strong>${p.altitudeDeg.toFixed(1)}°</strong></div><div><span>AZ</span><strong>${p.azimuthDeg.toFixed(1)}°</strong><small>${compassDirection(p.azimuthDeg)}</small></div></div></article><div class="detailGrid">${detailCard('Right ascension',fmtRA(p.raHours))}${detailCard('Declination',fmtSigned(p.decDeg))}${detailCard('Distance',moonKm?`${Math.round(moonKm).toLocaleString()} km`:`${p.distance.toFixed(p.distance<1?3:2)} AU`)}${detailCard('20° altitude',p.altitudeDeg>=20?'Above it now':(twenty?fmtEvent(twenty.time,now):'Not in 72 h'))}${detailCard('Next rise',rise?fmtEvent(rise.time,now):'Not in 48 h')}${detailCard('Next set',set?fmtEvent(set.time,now):'Not in 48 h')}</div><section class="panel notePanel"><p class="eyebrow">HOW TO AIM</p><h3>${aiming(p.altitudeDeg,p.azimuthDeg)}</h3><p>Azimuth is measured clockwise from north: east 90°, south 180°, west 270°. Altitude is the angle above the horizon.</p></section></section>`;document.getElementById('bodySelect').onchange=e=>{selectedBody=e.target.value;renderFinder()}}
function renderPlaceholder(which){const isEq=which==='Equipment';document.getElementById('page').innerHTML=`<section class="placeholder"><div class="orbit">◎</div><h3>${which}</h3><p>${isEq?'The desktop foundation is ready. Telescope and eyepiece profiles are planned for the next astronomy feature pass.':'The local observing log will live entirely on the device and is planned for the next astronomy feature pass.'}</p></section>`}
function renderSettings(){const o=parseObserver();document.getElementById('page').innerHTML=`<section class="settingsCard"><div class="settingsHeading"><div><h3>Observing location</h3><p>Saved locally on this computer. Longitude is negative west of Greenwich.</p></div><span class="validationBadge ${o?'valid':''}">${o?'Valid location':'Location incomplete'}</span></div><div class="fieldGrid"><label>Location name<input id="locName" value="${esc(settings.locationName)}" placeholder="Home or Farm"></label><label>Latitude<input id="lat" inputmode="decimal" value="${esc(settings.latitude)}" placeholder="36.0000"></label><label>Longitude<input id="lon" inputmode="decimal" value="${esc(settings.longitude)}" placeholder="-86.0000"></label><label>Elevation (m)<input id="elev" inputmode="decimal" value="${esc(settings.elevationM)}" placeholder="0"></label></div><div class="inlineActions"><button class="secondaryButton" id="saveLocation">Save location</button><button class="secondaryButton" id="geoButton">Use device location</button><button class="secondaryButton" id="fullscreenButton">Fullscreen</button><span id="geoMsg" class="mutedText"></span></div><div class="settingsDivider"></div><h3>Portable desktop mode</h3><p>This copy is a single-file offline build. The included launcher opens it in a cleaner app-style browser window when Microsoft Edge or Chrome is available.</p><div class="notice">Tip: press <span class="kbd">N</span> anywhere in the app to switch night vision on or off. Your brightness, theme, and observing location are remembered locally.</div><div class="settingsDivider"></div><h3>Data</h3><div class="inlineActions"><button class="secondaryButton" id="exportSettings">Export settings</button><button class="secondaryButton" id="resetSettings">Reset app settings</button></div></section>`;document.getElementById('saveLocation').onclick=()=>{settings.locationName=document.getElementById('locName').value;settings.latitude=document.getElementById('lat').value;settings.longitude=document.getElementById('lon').value;settings.elevationM=document.getElementById('elev').value;saveSettings();toast('Location saved');renderShell()};document.getElementById('geoButton').onclick=()=>{const msg=document.getElementById('geoMsg');if(!navigator.geolocation){msg.textContent='Geolocation is not available in this launch mode.';return}msg.textContent='Requesting location…';navigator.geolocation.getCurrentPosition(pos=>{settings.latitude=pos.coords.latitude.toFixed(6);settings.longitude=pos.coords.longitude.toFixed(6);if(pos.coords.altitude!=null)settings.elevationM=String(Math.round(pos.coords.altitude));saveSettings();msg.textContent='Location captured.';renderShell()},err=>msg.textContent='Could not get location: '+err.message,{enableHighAccuracy:true,timeout:12000,maximumAge:60000})};document.getElementById('fullscreenButton').onclick=()=>document.documentElement.requestFullscreen?.();document.getElementById('exportSettings').onclick=()=>{const blob=new Blob([JSON.stringify(settings,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='astronomy-companion-settings.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};document.getElementById('resetSettings').onclick=()=>{if(confirm('Reset Astronomy Companion settings on this computer?')){settings={...DEFAULT_SETTINGS};saveSettings();renderShell()}}}
window.addEventListener('keydown',e=>{if((e.key==='n'||e.key==='N')&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)){settings.theme=settings.theme==='night'?'day':'night';saveSettings();renderShell()}});
window.addEventListener('error',e=>{console.error(e.error||e.message);const p=document.getElementById('page');if(p)p.insertAdjacentHTML('afterbegin',`<div class="notice error">Something went wrong while calculating the sky. Reload the app or check the observing location values.</div>`)});
renderShell();
