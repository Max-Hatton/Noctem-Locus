//
// The orbital-element model and major perturbation terms are adapted from
// Paul Schlyter's "How to compute planetary positions". The implementation
// is intentionally self-contained so the observing app can work with no

const DEG = Math.PI / 180;
const RAD = 180 / Math.PI;
const DAY_MS = 86400000;
const EARTH_RADIUS_KM = 6378.14;
const SOLAR_SYSTEM_BODIES = [
    'Sun',
    'Moon',
    'Mercury',
    'Venus',
    'Mars',
    'Jupiter',
    'Saturn',
    'Uranus',
    'Neptune',
];
function sinDeg(x) { return Math.sin(x * DEG); }
function cosDeg(x) { return Math.cos(x * DEG); }
function asinDeg(x) { return Math.asin(Math.max(-1, Math.min(1, x))) * RAD; }
function atan2Deg(y, x) { return Math.atan2(y, x) * RAD; }
function normalizeDegrees(x) {
    return ((x % 360) + 360) % 360;
}
function normalizeSignedDegrees(x) {
    const n = normalizeDegrees(x);
    return n > 180 ? n - 360 : n;
}
/** Days since 1999-12-31 00:00 UTC (Schlyter day number d). */
function dayNumber(date) {
    return (date.getTime() - Date.UTC(1999, 11, 31, 0, 0, 0)) / DAY_MS;
}
function obliquity(d) {
    return 23.4393 - 3.563e-7 * d;
}
function sunElements(d) {
    return {
        N: 0,
        i: 0,
        w: normalizeDegrees(282.9404 + 4.70935e-5 * d),
        a: 1,
        e: 0.016709 - 1.151e-9 * d,
        M: normalizeDegrees(356.0470 + 0.9856002585 * d),

function moonElements(d) {
    return {
        N: normalizeDegrees(125.1228 - 0.0529538083 * d),
        i: 5.1454,
        w: normalizeDegrees(318.0634 + 0.1643573223 * d),
        a: 60.2666,
        e: 0.054900,
        M: normalizeDegrees(115.3654 + 13.0649929509 * d),
    };
}
function planetElements(body, d) {
    switch (body) {
        case 'Mercury': return { N: normalizeDegrees(48.3313 + 3.24587e-5 * d), i: 7.0047 + 5e-8 * d, w: normalizeDegrees(29.1241 + 1.01444e-5 * d), a: 0.387098, e: 0.205635 + 5.59e-10 * d, M: normalizeDegrees(168.6562 + 4.0923344368 * d) };
        case 'Venus': return { N: normalizeDegrees(76.6799 + 2.46590e-5 * d), i: 3.3946 + 2.75e-8 * d, w: normalizeDegrees(54.8910 + 1.38374e-5 * d), a: 0.723330, e: 0.006773 - 1.302e-9 * d, M: normalizeDegrees(48.0052 + 1.6021302244 * d) };
        case 'Mars': return { N: normalizeDegrees(49.5574 + 2.11081e-5 * d), i: 1.8497 - 1.78e-8 * d, w: normalizeDegrees(286.5016 + 2.92961e-5 * d), a: 1.523688, e: 0.093405 + 2.516e-9 * d, M: normalizeDegrees(18.6021 + 0.5240207766 * d) };
        case 'Jupiter': return { N: normalizeDegrees(100.4542 + 2.76854e-5 * d), i: 1.3030 - 1.557e-7 * d, w: normalizeDegrees(273.8777 + 1.64505e-5 * d), a: 5.20256, e: 0.048498 + 4.469e-9 * d, M: normalizeDegrees(19.8950 + 0.0830853001 * d) };
        case 'Saturn': return { N: normalizeDegrees(113.6634 + 2.38980e-5 * d), i: 2.4886 - 1.081e-7 * d, w: normalizeDegrees(339.3939 + 2.97661e-5 * d), a: 9.55475, e: 0.055546 - 9.499e-9 * d, M: normalizeDegrees(316.9670 + 0.0334442282 * d) };
        case 'Uranus': return { N: normalizeDegrees(74.0005 + 1.3978e-5 * d), i: 0.7733 + 1.9e-8 * d, w: normalizeDegrees(96.6612 + 3.0565e-5 * d), a: 19.18171 - 1.55e-8 * d, e: 0.047318 + 7.45e-9 * d, M: normalizeDegrees(142.5905 + 0.011725806 * d) };
        case 'Neptune': return { N: normalizeDegrees(131.7806 + 3.0173e-5 * d), i: 1.7700 - 2.55e-7 * d, w: normalizeDegrees(272.8461 - 6.027e-6 * d), a: 30.05826 + 3.313e-8 * d, e: 0.008606 + 2.15e-9 * d, M: normalizeDegrees(260.2471 + 0.005995147 * d) };

function eccentricAnomalyDeg(Mdeg, e) {
    const M = Mdeg * DEG;
    let E = M + e * Math.sin(M) * (1 + e * Math.cos(M));

function orbitVector(el) {

    const E = eccentricAnomalyDeg(el.M, el.e);

    const yv = Math.sqrt(1 - el.e * el.e) * sinDeg(E);

    const r = Math.hypot(xv, yv);

    const Ms = planetElements('Saturn', d).M;
    const Mu = planetElements('Uranus', d).M;
    if (body === 'Jupiter') {
        lon += -0.332 * sinDeg(2 * Mj - 5 * Ms - 67.6)
            - 0.056 * sinDeg(2 * Mj - 2 * Ms + 21)
            + 0.042 * sinDeg(3 * Mj - 5 * Ms + 21)
            - 0.036 * sinDeg(Mj - 2 * Ms)
            + 0.022 * cosDeg(Mj - Ms)
            + 0.023 * sinDeg(2 * Mj - 3 * Ms + 52)
            - 0.016 * sinDeg(Mj - 5 * Ms - 69);
    }
    else if (body === 'Saturn') {
        lon += 0.812 * sinDeg(2 * Mj - 5 * Ms - 67.6)
            - 0.229 * cosDeg(2 * Mj - 4 * Ms - 2)
            + 0.119 * sinDeg(Mj - 2 * Ms - 3)
            + 0.046 * sinDeg(2 * Mj - 6 * Ms - 69)
            + 0.014 * sinDeg(Mj - 3 * Ms + 32);
        lat += -0.020 * cosDeg(2 * Mj - 4 * Ms - 2)
            + 0.018 * sinDeg(2 * Mj - 6 * Ms - 49);
    }
    else if (body === 'Uranus') {
        lon += 0.040 * sinDeg(Ms - 2 * Mu + 6)
            + 0.035 * sinDeg(Ms - 3 * Mu + 33)
            - 0.015 * sinDeg(Mj - Mu + 20);
    }
    lon = normalizeDegrees(lon);
    const x = base.r * cosDeg(lon) * cosDeg(lat);
    const y = base.r * sinDeg(lon) * cosDeg(lat);
    const z = base.r * sinDeg(lat);
    return { x, y, z, r: base.r, lon, lat };
}
function moonEcliptic(d) {
    const mel = moonElements(d);
    const base = orbitVector(mel);
    const sel = sunElements(d);
    const Ms = sel.M;
    const Mm = mel.M;
    const Ls = normalizeDegrees(sel.M + sel.w);
    const Lm = normalizeDegrees(mel.M + mel.w + mel.N);
    const D = normalizeSignedDegrees(Lm - Ls);
    const F = normalizeSignedDegrees(Lm - mel.N);
    let lon = base.lon
        - 1.274 * sinDeg(Mm - 2 * D)
        + 0.658 * sinDeg(2 * D)
        - 0.186 * sinDeg(Ms)
        - 0.059 * sinDeg(2 * Mm - 2 * D)
        - 0.057 * sinDeg(Mm - 2 * D + Ms)
        + 0.053 * sinDeg(Mm + 2 * D)
        + 0.046 * sinDeg(2 * D - Ms)
        + 0.041 * sinDeg(Mm - Ms)
        - 0.035 * sinDeg(D)
        - 0.031 * sinDeg(Mm + Ms)
        - 0.015 * sinDeg(2 * F - 2 * D)
        + 0.011 * sinDeg(Mm - 4 * D);
    let lat = base.lat
        - 0.173 * sinDeg(F - 2 * D)
        - 0.055 * sinDeg(Mm - F - 2 * D)
        - 0.046 * sinDeg(Mm + F - 2 * D)
        + 0.033 * sinDeg(F + 2 * D)
        + 0.017 * sinDeg(2 * Mm + F);
    const r = base.r - 0.58 * cosDeg(Mm - 2 * D) - 0.46 * cosDeg(2 * D);
    lon = normalizeDegrees(lon);
    const x = r * cosDeg(lon) * cosDeg(lat);
    const y = r * sinDeg(lon) * cosDeg(lat);
    const z = r * sinDeg(lat);
    return { x, y, z, r, lon, lat };
}
function eclipticToEquatorial(v, d) {
    const ecl = obliquity(d);
    const xe = v.x;
    const ye = v.y * cosDeg(ecl) - v.z * sinDeg(ecl);
    const ze = v.y * sinDeg(ecl) + v.z * cosDeg(ecl);
    const raDeg = normalizeDegrees(atan2Deg(ye, xe));
    const decDeg = atan2Deg(ze, Math.hypot(xe, ye));

function deepClone(v){return JSON.parse(JSON.stringify(v))}
function normalizeEquipment(eq){const base=deepClone(DEFAULT_EQUIPMENT);if(!eq||typeof eq!=='object')return base;const scopes=Array.isArray(eq.telescopes)&&eq.telescopes.length?deepClone(eq.telescopes):base.telescopes;const oldOrion=scopes.find(s=>s.id==='scope-90');if(oldOrion){if(!String(oldOrion.focalLengthMm??'').trim())oldOrion.focalLengthMm='910';if(!String(oldOrion.apertureMm??'').trim())oldOrion.apertureMm='90';if(oldOrion.name==='Current Orion 90 mm'||!String(oldOrion.name??'').trim())oldOrion.name='Orion AstroView 90mm EQ #9024';if(!oldOrion.type)oldOrion.type='Refractor'}const eyepieces=Array.isArray(eq.eyepieces)?eq.eyepieces:[];return{telescopes:scopes,activeTelescopeId:eq.activeTelescopeId||scopes[0]?.id||'',eyepieces}}

function parseObserver(){if(String(settings.latitude).trim()===''||String(settings.longitude).trim()==='')return null;const latitude=Number(settings.latitude),longitude=Number(settings.longitude),elevationM=Number(settings.elevationM||0);if(!Number.isFinite(latitude)||latitude<-90||latitude>90||!Number.isFinite(longitude)||longitude<-180||longitude>180)return null;return{latitude,longitude,elevationM:Number.isFinite(elevationM)?elevationM:0}}
function activeScope(){return settings.equipment.telescopes.find(s=>s.id===settings.equipment.activeTelescopeId)||settings.equipment.telescopes[0]||null}
function num(v){const n=Number(v);return Number.isFinite(n)&&n>0?n:null}
function applyTheme(){const app=document.getElementById('app');if(!app)return;app.className='app '+settings.theme;const overlay=document.getElementById('brightnessOverlay');if(overlay)overlay.style.opacity=String(1-Math.max(5,Math.min(100,settings.brightness))/100);const br=document.getElementById('brightnessRange');if(br)br.value=settings.brightness;const bl=document.getElementById('brightnessLabel');if(bl)bl.textContent=settings.brightness+'%';const tog=document.getElementById('nightToggle');if(tog)tog.textContent=settings.theme==='night'?'ON':'OFF'}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function fmtTime(d){return new Intl.DateTimeFormat(undefined,{hour:'numeric',minute:'2-digit'}).format(d)}
function fmtDate(d){return new Intl.DateTimeFormat(undefined,{weekday:'short',month:'short',day:'numeric'}).format(d)}
function relativeTime(target,now){const min=Math.round((target-now)/60000);if(min<1)return'now';const h=Math.floor(min/60),m=min%60;return h?`in ${h}h ${m}m`:`in ${m}m`}
function fmtEvent(target,now){return target.toDateString()===now.toDateString()?`${fmtTime(target)} · ${relativeTime(target,now)}`:`${fmtDate(target)} ${fmtTime(target)}`}
function fmtRA(hours){const h=Math.floor(hours),mf=(hours-h)*60,m=Math.floor(mf),s=Math.round((mf-m)*60);return`${h}h ${m}m ${s}s`}
function fmtSigned(deg){const sign=deg>=0?'+':'−',v=Math.abs(deg),d=Math.floor(v),m=Math.round((v-d)*60);return`${sign}${d}° ${m}′`}
function skyState(a){if(a>=0)return'Daylight right now.';if(a>=-6)return'Civil twilight.';if(a>=-12)return'Nautical twilight.';if(a>=-18)return'Astronomical twilight.';return'The sky is astronomically dark.'}

function julianDate(date){return date.getTime()/DAY_MS+2440587.5}
function precessJ2000(raHours,decDeg,date){const T=(julianDate(date)-2451545.0)/36525;const zeta=(2306.2181*T+0.30188*T*T+0.017998*T*T*T)/3600;const z=(2306.2181*T+1.09468*T*T+0.018203*T*T*T)/3600;const theta=(2004.3109*T-0.42665*T*T-0.041833*T*T*T)/3600;const ra=raHours*15;const A=cosDeg(decDeg)*sinDeg(ra+zeta);const B=cosDeg(theta)*cosDeg(decDeg)*cosDeg(ra+zeta)-sinDeg(theta)*sinDeg(decDeg);const C=sinDeg(theta)*cosDeg(decDeg)*cosDeg(ra+zeta)+cosDeg(theta)*sinDeg(decDeg);return{raHours:normalizeDegrees(atan2Deg(A,B)+z)/15,decDeg:asinDeg(C)}}

function allCatalogObjects(){const solar=SOLAR_SYSTEM_BODIES.map(name=>({key:'sol:'+name,name,category:'planet',kind:name==='Sun'?'Star':name==='Moon'?'Moon':'Planet'}));const stars=BRIGHT_STARS.map(s=>({key:'star:'+s.name,category:'star',kind:'Bright star',...s}));const messier=MESSIER_CATALOG.map(m=>({key:'messier:'+m.id,category:'messier',...m}));return[...solar,...stars,...messier]}
const OBJECT_CATALOG=allCatalogObjects();
function catalogObject(key){return OBJECT_CATALOG.find(o=>o.key===key)||OBJECT_CATALOG.find(o=>o.key==='sol:Saturn')}
function positionForObject(obj,observer,date=new Date()){if(obj.category==='planet'){const p=getBodyPosition(obj.name,observer,date);return{...obj,...p}}return fixedPosition(obj,observer,date)}
function altitudeAtObject(obj,observer,date){return positionForObject(obj,observer,date).altitudeDeg}
function findFixedCrossing(obj,observer,start,targetAltitude,direction,maxHours=48){const stepMs=5*60*1000,end=start.getTime()+maxHours*3600000;let t0=start.getTime(),y0=altitudeAtObject(obj,observer,new Date(t0))-targetAltitude;for(let t1=t0+stepMs;t1<=end;t1+=stepMs){const y1=altitudeAtObject(obj,observer,new Date(t1))-targetAltitude;const crossed=direction===1?(y0<0&&y1>=0):(y0>=0&&y1<0);if(crossed){let lo=t0,hi=t1;for(let i=0;i<22;i++){const mid=(lo+hi)/2,y=altitudeAtObject(obj,observer,new Date(mid))-targetAltitude;if(direction===1){if(y>=0)hi=mid;else lo=mid}else{if(y<0)hi=mid;else lo=mid}}return{time:new Date((lo+hi)/2)}}t0=t1;y0=y1}return null}
function nextRiseObject(obj,observer,start){return obj.category==='planet'?findNextRise(obj.name,observer,start):findFixedCrossing(obj,observer,start,-34/60,1,48)}
function nextSetObject(obj,observer,start){return obj.category==='planet'?findNextSet(obj.name,observer,start):findFixedCrossing(obj,observer,start,-34/60,-1,48)}
function nextTwentyObject(obj,observer,start){const p=positionForObject(obj,observer,start);if(p.altitudeDeg>=20)return null;return obj.category==='planet'?findNextAltitudeCrossing(obj.name,observer,start,20,1,72):findFixedCrossing(obj,observer,start,20,1,72)}
function objectMagnitude(obj){return Number.isFinite(obj.mag)?obj.mag:null}
function objectDisplayName(obj){if(obj.category==='messier'&&obj.name!==obj.id)return`${obj.id} · ${obj.name}`;return obj.name}
function objectSubtitle(obj){if(obj.category==='messier')return`${obj.kind}${obj.ngc?' · NGC '+obj.ngc:''}${obj.mag!=null?' · mag '+obj.mag.toFixed(1):''}`;if(obj.category==='star')return`${obj.constellation} · mag ${obj.mag.toFixed(2)}`;return obj.kind}
function equipmentCapability(){const s=activeScope(),ap=s?num(s.apertureMm):null;return ap||0}
function observeRating(obj,p,observer,date){if(p.altitudeDeg<0)return{label:'Below horizon',className:'poor',score:-100,reason:'Wait for it to rise.'};const sun=getBodyPosition('Sun',observer,date),moon=getBodyPosition('Moon',observer,date),phase=getMoonPhase(date);let score=Math.min(55,p.altitudeDeg);let reason=[];if(p.altitudeDeg<10){score-=35;reason.push('very low')}else if(p.altitudeDeg<20){score-=18;reason.push('low')}else if(p.altitudeDeg>=45){score+=12;reason.push('high in sky')}if(obj.category==='messier'){if(sun.altitudeDeg>=-6){score-=60;reason.push('sky too bright')}else if(sun.altitudeDeg>=-12){score-=30;reason.push('twilight')}else if(sun.altitudeDeg>=-18){score-=12;reason.push('not fully dark')}else{score+=18;reason.push('dark sky')}const mag=objectMagnitude(obj);if(mag!=null)score-=Math.max(0,mag-6)*3.5;const sep=angularSeparationDeg(p,moon);if(moon.altitudeDeg>0&&phase.illuminatedFraction>0.35){const penalty=phase.illuminatedFraction*(sep<30?28:sep<60?16:8);score-=penalty;reason.push('moonlight')}const ap=equipmentCapability();if(ap>=200)score+=8;else if(ap>0&&ap<80)score-=6}else if(obj.category==='planet'){if(p.altitudeDeg>=25)score+=12;if(sun.altitudeDeg<0)score+=8}else{if(p.altitudeDeg>=25)score+=10;if(sun.altitudeDeg<0)score+=8}let label=score>=62?'Excellent':score>=42?'Good':score>=22?'Fair':'Poor';return{label,className:label==='Excellent'||label==='Good'?'good':'poor',score,reason:reason.length?reason.join(' · '):'Usable position'}}
function searchObjects(query,category){const q=query.trim().toLowerCase();return OBJECT_CATALOG.filter(o=>(category==='all'||o.category===category)&&(!q||[o.name,o.id,o.ngc?`ngc ${o.ngc}`:'',o.constellation||'',o.kind||''].join(' ').toLowerCase().includes(q))).slice(0,40)}
function bestDeepSky(observer,date){return MESSIER_CATALOG.map(m=>{const o=catalogObject('messier:'+m.id),p=positionForObject(o,observer,date),r=observeRating(o,p,observer,date);return{o,p,r}}).filter(x=>x.p.altitudeDeg>5).sort((a,b)=>b.r.score-a.r.score).slice(0,6)}
function eyepieceMath(scope,ep){const f=num(scope?.focalLengthMm),a=num(scope?.apertureMm),ef=num(ep?.focalLengthMm),af=num(ep?.apparentFovDeg);if(!f||!a||!ef)return null;const mag=f/ef,exit=a/mag,trueFov=af?af/mag:null;return{mag,exit,trueFov,fRatio:f/a}}
function renderShell(){document.getElementById('app').innerHTML=`<div class="shell"><aside class="sidebar"><div class="brand"><div class="brandMark">✦</div><div><h1>Astronomy Companion</h1><p>Desktop astronomy v0.4.1</p><span class="desktopBadge">● Offline portable build</span></div></div><nav>${PAGES.map(p=>`<button class="navButton ${page===p?'active':''}" data-page="${p}">${p}</button>`).join('')}</nav><div class="nightControls"><div class="controlRow"><span>Night vision</span><button id="nightToggle" class="toggle">${settings.theme==='night'?'ON':'OFF'}</button></div><label>App brightness <strong id="brightnessLabel">${settings.brightness}%</strong><input id="brightnessRange" type="range" min="5" max="100" value="${settings.brightness}"></label><button id="deepNight" class="deepNight">Deep Night</button><div class="mutedText">Shortcut: <span class="kbd">N</span> toggles night mode</div></div></aside><main class="content"><header class="topbar"><div><p class="eyebrow">OFFLINE-FIRST OBSERVING TOOL</p><h2>${page}</h2></div><div class="status"><span class="statusDot"></span>${parseObserver()?esc(settings.locationName||'Location set'):'Location needed'}</div></header><div id="page"></div></main></div><div id="brightnessOverlay" class="brightnessOverlay"></div><div id="toast" class="toast"></div>`;bindShell();applyTheme();renderPage()}
function bindShell(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;renderShell()});document.getElementById('nightToggle').onclick=()=>{settings.theme=settings.theme==='night'?'day':'night';saveSettings();renderShell()};document.getElementById('brightnessRange').oninput=e=>{settings.brightness=Number(e.target.value);saveSettings();applyTheme()};document.getElementById('deepNight').onclick=()=>{settings.theme='night';settings.brightness=12;saveSettings();renderShell()}}
function renderPage(){clearInterval(tickTimer);if(page==='Tonight')renderTonight();else if(page==='Find Object')renderFinder();else if(page==='Equipment')renderEquipment();else if(page==='Settings')renderSettings();else renderObservations();if(page==='Tonight'||page==='Find Object')tickTimer=setInterval(()=>renderPage(),30000)}
function locationRequired(){document.getElementById('page').innerHTML=`<section class="placeholder"><div class="orbit">◎</div><h3>Set an observing location first</h3><p>Altitude, azimuth, rise/set times, and darkness all depend on where the telescope is on Earth.</p><button class="primaryButton" id="goSettings">Open Settings</button></section>`;document.getElementById('goSettings').onclick=()=>{page='Settings';renderShell()}}
function summaryCard(label,value,detail){return`<article class="card"><span class="cardLabel">${label}</span><strong>${value}</strong><small>${detail}</small></article>`}
function detailCard(label,value){return`<article class="detailCard"><span>${label}</span><strong>${value}</strong></article>`}
function renderTonight(){const observer=parseObserver();if(!observer)return locationRequired();const now=new Date(),moon=getBodyPosition('Moon',observer,now),sun=getBodyPosition('Sun',observer,now),phase=getMoonPhase(now),planets=['Mercury','Venus','Mars','Jupiter','Saturn','Uranus','Neptune'].map(b=>getBodyPosition(b,observer,now)).sort((a,b)=>b.altitudeDeg-a.altitudeDeg),best=bestDeepSky(observer,now);const sunset=findNextSet('Sun',observer,now),dark=sun.altitudeDeg<-18?findNextAstronomicalDawn(observer,now):findNextAstronomicalDusk(observer,now);document.getElementById('page').innerHTML=`<section class="pageStack"><article class="heroCard"><div class="heroTopline"><div><p class="eyebrow">LIVE SKY · ${esc(settings.locationName||`${observer.latitude.toFixed(3)}°, ${observer.longitude.toFixed(3)}°`)}</p><h3>${skyState(sun.altitudeDeg)}</h3></div><div class="clockBlock"><strong>${fmtTime(now)}</strong><span>${fmtDate(now)}</span></div></div><p class="heroBody">Solar-system positions, bright stars, Messier targets, and equipment calculations all run locally on this computer.</p></article><div class="summaryGrid">${summaryCard('Moon',`${Math.round(phase.illuminatedFraction*100)}%`,`${phase.name} · ${moon.altitudeDeg.toFixed(1)}° ${altitudeLabel(moon.altitudeDeg).toLowerCase()}`)}${summaryCard('Sunset',sunset?fmtTime(sunset.time):'—',sunset?relativeTime(sunset.time,now):'No crossing found in 48 h')}${summaryCard(sun.altitudeDeg<-18?'Astronomical dawn':'Astronomical dark',dark?fmtTime(dark.time):'—',sun.altitudeDeg<-18?'Dark sky now':`Sun ${sun.altitudeDeg.toFixed(1)}° altitude`)}</div><section class="panel"><div class="panelHeader"><div><p class="eyebrow">DEEP-SKY PICKS</p><h3>Best Messier targets right now</h3></div><div class="catalogStats"><span>110 Messier entries</span><span>${BRIGHT_STARS.length} bright stars</span></div></div><div class="recommendGrid">${best.map(x=>`<button class="recommendCard" data-object="${x.o.key}"><strong>${esc(x.o.id)}</strong><span>${esc(x.o.name)}</span><small>${x.p.altitudeDeg.toFixed(0)}° · ${compassDirection(x.p.azimuthDeg)} · ${x.r.label}</small></button>`).join('')||'<div class="notice">No Messier objects are in a useful position right now.</div>'}</div></section><section class="panel"><div class="panelHeader"><div><p class="eyebrow">SOLAR SYSTEM</p><h3>What is up right now</h3></div><span class="mutedText">Geometric altitude</span></div><div class="targetTable">${planets.map(p=>`<div class="targetRow"><div class="targetName"><strong>${p.body}</strong><span>${altitudeLabel(p.altitudeDeg)}</span></div><div class="targetMetric"><span>Altitude</span><strong>${p.altitudeDeg.toFixed(1)}°</strong></div><div class="targetMetric"><span>Direction</span><strong>${compassDirection(p.azimuthDeg)} ${p.azimuthDeg.toFixed(0)}°</strong></div><div class="horizonPill ${p.altitudeDeg>=0?'up':'down'}">${p.altitudeDeg>=0?'Above horizon':'Below horizon'}</div></div>`).join('')}</div></section></section>`;document.querySelectorAll('[data-object]').forEach(b=>b.onclick=()=>{selectedObjectKey=b.dataset.object;searchQuery=catalogObject(selectedObjectKey).id||catalogObject(selectedObjectKey).name;page='Find Object';renderShell()})}
function renderFinder(){const observer=parseObserver();if(!observer)return locationRequired();const now=new Date(),obj=catalogObject(selectedObjectKey),p=positionForObject(obj,observer,now),rise=nextRiseObject(obj,observer,now),set=nextSetObject(obj,observer,now),twenty=nextTwentyObject(obj,observer,now),rating=observeRating(obj,p,observer,now),results=searchObjects(searchQuery,searchCategory),moonKm=obj.category==='planet'&&obj.name==='Moon'?moonDistanceKm(p):null;const distance=obj.category==='planet'?(moonKm?`${Math.round(moonKm).toLocaleString()} km`:(p.distance?`${p.distance.toFixed(p.distance<1?3:2)} AU`:'—')):(obj.mag!=null?`Magnitude ${obj.mag.toFixed(obj.category==='star'?2:1)}`:'Fixed sky object');document.getElementById('page').innerHTML=`<section class="pageStack"><div class="finderBar"><div class="finderTools"><label class="searchBox"><span>Search planets, stars, M / NGC</span><input id="objectSearch" class="searchInput" value="${esc(searchQuery)}" placeholder="Try M31, Vega, Saturn, NGC 224"></label><label><span class="fieldLabel">Catalog</span><select id="searchCategory"><option value="all">All objects</option><option value="planet">Solar system</option><option value="star">Bright stars</option><option value="messier">Messier</option></select></label></div><div class="finderNow"><span>Calculated for</span><strong>${fmtTime(now)}</strong></div></div>${searchQuery?`<div class="resultsList">${results.map(o=>`<button class="resultButton" data-result="${o.key}"><span><strong>${esc(objectDisplayName(o))}</strong><br><small>${esc(objectSubtitle(o))}</small></span><small>${esc(TYPE_ICONS[o.category]||'Object')}</small></button>`).join('')||'<div class="notice">No catalog matches.</div>'}</div>`:''}<article class="objectHero"><div><p class="eyebrow">CURRENT POINTING · ${esc(TYPE_ICONS[obj.category]||'OBJECT')}</p><h3>${esc(obj.category==='messier'?obj.id:obj.name)}</h3><p class="objectMeta">${esc(obj.category==='messier'?obj.name:objectSubtitle(obj))}</p><p class="objectStatus">${p.altitudeDeg>=0?`${altitudeLabel(p.altitudeDeg)} in the ${compassDirection(p.azimuthDeg)}`:'Currently below your horizon'}</p><span class="ratingPill ${rating.className}">${rating.label} now · ${esc(rating.reason)}</span></div><div class="pointingReadout"><div><span>ALT</span><strong>${p.altitudeDeg.toFixed(1)}°</strong></div><div><span>AZ</span><strong>${p.azimuthDeg.toFixed(1)}°</strong><small>${compassDirection(p.azimuthDeg)}</small></div></div></article><div class="detailGrid">${detailCard('Right ascension',fmtRA(p.raHours))}${detailCard('Declination',fmtSigned(p.decDeg))}${detailCard(obj.category==='messier'?'Catalog / brightness':'Distance / brightness',distance)}${detailCard('20° altitude',p.altitudeDeg>=20?'Above it now':(twenty?fmtEvent(twenty.time,now):'Not in 72 h'))}${detailCard('Next rise',rise?fmtEvent(rise.time,now):'Not in 48 h')}${detailCard('Next set',set?fmtEvent(set.time,now):'Not in 48 h')}</div><section class="panel notePanel"><p class="eyebrow">HOW TO AIM</p><h3>${aiming(p.altitudeDeg,p.azimuthDeg)}</h3><p>For stars and Messier objects, catalog J2000 coordinates are precessed to the current date before altitude and azimuth are calculated. The Observe Now rating is intentionally a quick planning estimate, not a guarantee of visibility.</p></section></section>`;const cat=document.getElementById('searchCategory');cat.value=searchCategory;cat.onchange=e=>{searchCategory=e.target.value;renderFinder()};document.getElementById('objectSearch').oninput=e=>{searchQuery=e.target.value;renderFinder();const i=document.getElementById('objectSearch');if(i){i.focus();i.setSelectionRange(searchQuery.length,searchQuery.length)}};document.querySelectorAll('[data-result]').forEach(b=>b.onclick=()=>{selectedObjectKey=b.dataset.result;searchQuery='';renderFinder()})}
function renderEquipment(){const eq=settings.equipment,scope=activeScope();document.getElementById('page').innerHTML=`<section class="pageStack"><div class="equipmentGrid"><section class="equipmentCard"><p class="eyebrow">TELESCOPES</p><h3>Optical profiles</h3><p class="mutedText">Your Orion AstroView 90mm EQ #9024 is preloaded at 90 mm aperture and 910 mm focal length (about f/10.1). You can still edit the profile if needed.</p><div class="profileSelect"><select id="activeScope">${eq.telescopes.map(s=>`<option value="${esc(s.id)}" ${s.id===eq.activeTelescopeId?'selected':''}>${esc(s.name)}</option>`).join('')}</select><button class="miniButton" id="addScope">+ Telescope</button></div>${scope?`<div class="formGrid"><label>Name<input id="scopeName" value="${esc(scope.name)}"></label><label>Type<select id="scopeType"><option>Refractor</option><option>Reflector</option><option>Dobsonian</option><option>SCT / Mak</option><option>Other</option></select></label><label>Aperture (mm)<input id="scopeAperture" inputmode="decimal" value="${esc(scope.apertureMm)}"></label><label>Focal length (mm)<input id="scopeFocal" inputmode="decimal" value="${esc(scope.focalLengthMm)}" placeholder="Read from telescope label"></label></div><div class="inlineActions"><button class="secondaryButton" id="saveScope">Save telescope</button>${eq.telescopes.length>1?'<button class="secondaryButton" id="deleteScope">Delete</button>':''}</div>${scopeMathSummary(scope)}`:''}</section><section class="equipmentCard"><p class="eyebrow">EYEPIECES</p><h3>Eyepiece case</h3><p class="mutedText">Add the focal length and apparent field of view (AFOV). True field is an approximation: AFOV ÷ magnification.</p><div class="formGrid"><label>Name<input id="epName" placeholder="13 mm Plössl"></label><label>Focal length (mm)<input id="epFocal" inputmode="decimal" placeholder="13"></label><label>AFOV (degrees)<input id="epAfov" inputmode="decimal" placeholder="50"></label><label>&nbsp;<button class="secondaryButton" id="addEyepiece">Add eyepiece</button></label></div><div class="equipmentTable">${eq.eyepieces.length?eq.eyepieces.map(ep=>eyepieceRow(scope,ep)).join(''):'<div class="notice">No eyepieces saved yet.</div>'}</div></section></div></section>`;if(scope){const st=document.getElementById('scopeType');st.value=scope.type||'Other';document.getElementById('activeScope').onchange=e=>{eq.activeTelescopeId=e.target.value;saveSettings();renderEquipment()};document.getElementById('saveScope').onclick=()=>{scope.name=document.getElementById('scopeName').value||'Telescope';scope.type=st.value;scope.apertureMm=document.getElementById('scopeAperture').value;scope.focalLengthMm=document.getElementById('scopeFocal').value;saveSettings();toast('Telescope saved');renderEquipment()};document.getElementById('deleteScope')?.addEventListener('click',()=>{eq.telescopes=eq.telescopes.filter(s=>s.id!==scope.id);eq.activeTelescopeId=eq.telescopes[0]?.id||'';saveSettings();renderEquipment()})}document.getElementById('addScope').onclick=()=>{const id='scope-'+Date.now();eq.telescopes.push({id,name:'New telescope',apertureMm:'',focalLengthMm:'',type:'Reflector'});eq.activeTelescopeId=id;saveSettings();renderEquipment()};document.getElementById('addEyepiece').onclick=()=>{const name=document.getElementById('epName').value.trim(),f=document.getElementById('epFocal').value,af=document.getElementById('epAfov').value;if(!num(f)){toast('Enter an eyepiece focal length');return}eq.eyepieces.push({id:'ep-'+Date.now(),name:name||`${f} mm eyepiece`,focalLengthMm:f,apparentFovDeg:af});saveSettings();renderEquipment()};document.querySelectorAll('[data-delete-ep]').forEach(b=>b.onclick=()=>{eq.eyepieces=eq.eyepieces.filter(ep=>ep.id!==b.dataset.deleteEp);saveSettings();renderEquipment()})}
function scopeMathSummary(scope){const a=num(scope.apertureMm),f=num(scope.focalLengthMm);if(!a||!f)return`<div class="notice" style="margin-top:16px">Add the telescope focal length to unlock focal ratio, magnification, exit pupil, and field-of-view calculations.</div>`;return`<div class="calcGrid"><div class="calcBox"><span>Focal ratio</span><strong>f/${(f/a).toFixed(1)}</strong></div><div class="calcBox"><span>Aperture</span><strong>${a.toFixed(0)} mm</strong></div><div class="calcBox"><span>Focal length</span><strong>${f.toFixed(0)} mm</strong></div><div class="calcBox"><span>Rule-of-thumb max</span><strong>~${Math.round(a*2)}×</strong></div></div><p class="eqNote">The ~2× aperture-in-mm maximum is only a rough upper limit; seeing and optical quality often set a lower useful magnification.</p>`}
function eyepieceRow(scope,ep){const m=eyepieceMath(scope,ep);return`<div class="equipmentRow"><div><strong>${esc(ep.name)}</strong><br><span>${esc(ep.focalLengthMm)} mm · ${esc(ep.apparentFovDeg||'—')}° AFOV</span></div><div><span>Magnification</span><br><strong>${m?m.mag.toFixed(0)+'×':'—'}</strong></div><div><span>Exit pupil</span><br><strong>${m?m.exit.toFixed(2)+' mm':'—'}</strong></div><div><span>True field</span><br><strong>${m&&m.trueFov?m.trueFov.toFixed(2)+'°':'—'}</strong></div><button class="miniButton" data-delete-ep="${esc(ep.id)}">Remove</button></div>`}
function renderObservations(){document.getElementById('page').innerHTML=`<section class="placeholder"><div class="orbit">◎</div><h3>Observation log</h3><p>Still intentionally parked for the next pass. v0.4.1 keeps the target catalog and equipment math solid while adding your exact telescope profile.</p></section>`}
function renderSettings(){const o=parseObserver();document.getElementById('page').innerHTML=`<section class="settingsCard"><div class="settingsHeading"><div><h3>Observing location</h3><p>Saved locally on this computer. Longitude is negative west of Greenwich.</p></div><span class="validationBadge ${o?'valid':''}">${o?'Valid location':'Location incomplete'}</span></div><div class="fieldGrid"><label>Location name<input id="locName" value="${esc(settings.locationName)}" placeholder="Home or Farm"></label><label>Latitude<input id="lat" inputmode="decimal" value="${esc(settings.latitude)}" placeholder="36.0000"></label><label>Longitude<input id="lon" inputmode="decimal" value="${esc(settings.longitude)}" placeholder="-86.0000"></label><label>Elevation (m)<input id="elev" inputmode="decimal" value="${esc(settings.elevationM)}" placeholder="0"></label></div><div class="inlineActions"><button class="secondaryButton" id="saveLocation">Save location</button><button class="secondaryButton" id="geoButton">Use device location</button><button class="secondaryButton" id="fullscreenButton">Fullscreen</button><span id="geoMsg" class="mutedText"></span></div><div class="settingsDivider"></div><h3>Offline catalog</h3><p>v0.4.1 contains the solar-system engine, ${BRIGHT_STARS.length} bright stars, and 110 Messier entries inside the app file itself.</p><div class="notice">Press <span class="kbd">N</span> anywhere in the app to switch night vision on or off. Theme, brightness, location, telescope profiles, and eyepieces are stored locally.</div><div class="settingsDivider"></div><h3>Data</h3><div class="inlineActions"><button class="secondaryButton" id="exportSettings">Export settings</button><button class="secondaryButton" id="resetSettings">Reset app settings</button></div></section>`;document.getElementById('saveLocation').onclick=()=>{settings.locationName=document.getElementById('locName').value;settings.latitude=document.getElementById('lat').value;settings.longitude=document.getElementById('lon').value;settings.elevationM=document.getElementById('elev').value;saveSettings();toast('Location saved');renderShell()};document.getElementById('geoButton').onclick=()=>{const msg=document.getElementById('geoMsg');if(!navigator.geolocation){msg.textContent='Geolocation is not available in this launch mode.';return}msg.textContent='Requesting location…';navigator.geolocation.getCurrentPosition(pos=>{settings.latitude=pos.coords.latitude.toFixed(6);settings.longitude=pos.coords.longitude.toFixed(6);if(pos.coords.altitude!=null)settings.elevationM=String(Math.round(pos.coords.altitude));saveSettings();msg.textContent='Location captured.';renderShell()},err=>msg.textContent='Could not get location: '+err.message,{enableHighAccuracy:true,timeout:12000,maximumAge:60000})};document.getElementById('fullscreenButton').onclick=()=>document.documentElement.requestFullscreen?.();document.getElementById('exportSettings').onclick=()=>{const blob=new Blob([JSON.stringify(settings,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='astronomy-companion-v0.4.1-settings.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};document.getElementById('resetSettings').onclick=()=>{if(confirm('Reset Astronomy Companion settings on this computer?')){settings=deepClone(DEFAULT_SETTINGS);saveSettings();renderShell()}}}
window.addEventListener('keydown',e=>{if((e.key==='n'||e.key==='N')&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)){settings.theme=settings.theme==='night'?'day':'night';saveSettings();renderShell()}});
window.addEventListener('error',e=>{console.error(e.error||e.message);const p=document.getElementById('page');if(p)p.insertAdjacentHTML('afterbegin',`<div class="notice error">Something went wrong while calculating the sky. Reload the app or check the saved values.</div>`)});
renderShell();
</script></body></html>
