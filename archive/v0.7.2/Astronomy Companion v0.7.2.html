function renderEquipment(){const eq=settings.equipment,scope=activeScope();document.getElementById('page').innerHTML=`<section class="pageStack"><div class="equipmentGrid"><section class="equipmentCard"><p class="eyebrow">TELESCOPES</p><h3>Optical profiles</h3><p class="mutedText">Your Orion AstroView 90mm EQ #9024 is preloaded at 90 mm aperture and 910 mm focal length (about f/10.1). You can still edit the profile if needed.</p><div class="profileSelect"><select id="activeScope">${eq.telescopes.map(s=>`<option value="${esc(s.id)}" ${s.id===eq.activeTelescopeId?'selected':''}>${esc(s.name)}</option>`).join('')}</select><button class="miniButton" id="addScope">+ Telescope</button></div>${scope?`<div class="formGrid"><label>Name<input id="scopeName" value="${esc(scope.name)}"></label><label>Type<select id="scopeType"><option>Refractor</option><option>Reflector</option><option>Dobsonian</option><option>SCT / Mak</option><option>Other</option></select></label><label>Aperture (mm)<input id="scopeAperture" inputmode="decimal" value="${esc(scope.apertureMm)}"></label><label>Focal length (mm)<input id="scopeFocal" inputmode="decimal" value="${esc(scope.focalLengthMm)}" placeholder="Read from telescope label"></label></div><div class="inlineActions"><button class="secondaryButton" id="saveScope">Save telescope</button>${eq.telescopes.length>1?'<button class="secondaryButton" id="deleteScope">Delete</button>':''}</div>${scopeMathSummary(scope)}`:''}</section><section class="equipmentCard"><p class="eyebrow">EYEPIECES</p><h3>Eyepiece case</h3><p class="mutedText">Add the focal length and apparent field of view (AFOV). True field is an approximation: AFOV ÷ magnification.</p><div class="formGrid"><label>Name<input id="epName" placeholder="13 mm Plössl"></label><label>Focal length (mm)<input id="epFocal" inputmode="decimal" placeholder="13"></label><label>AFOV (degrees)<input id="epAfov" inputmode="decimal" placeholder="50"></label><label>&nbsp;<button class="secondaryButton" id="addEyepiece">Add eyepiece</button></label></div><div class="equipmentTable">${eq.eyepieces.length?eq.eyepieces.map(ep=>eyepieceRow(scope,ep)).join(''):'<div class="notice">No eyepieces saved yet.</div>'}</div></section></div><section class="equipmentCard"><p class="eyebrow">FINDER / NAVIGATION</p><h3>Star-hop scale</h3><p class="mutedText">Enter the approximate true field of your finder. Push-To uses this to convert angular separation into finder fields. If you do not know it yet, 5° is a reasonable temporary placeholder—not a claim about your specific finder.</p><div class="formGrid"><label>Finder field (degrees)<input id="finderFovSetting" inputmode="decimal" value="${esc(finderFov())}"></label></div><div class="inlineActions"><button class="secondaryButton" id="saveFinderFov">Save finder field</button></div></section></section>`;if(scope){const st=document.getElementById('scopeType');st.value=scope.type||'Other';document.getElementById('activeScope').onchange=e=>{eq.activeTelescopeId=e.target.value;saveSettings();renderEquipment()};document.getElementById('saveScope').onclick=()=>{scope.name=document.getElementById('scopeName').value||'Telescope';scope.type=st.value;scope.apertureMm=document.getElementById('scopeAperture').value;scope.focalLengthMm=document.getElementById('scopeFocal').value;saveSettings();toast('Telescope saved');renderEquipment()};document.getElementById('deleteScope')?.addEventListener('click',()=>{eq.telescopes=eq.telescopes.filter(s=>s.id!==scope.id);eq.activeTelescopeId=eq.telescopes[0]?.id||'';saveSettings();renderEquipment()})}document.getElementById('saveFinderFov').onclick=()=>{const n=Number(document.getElementById('finderFovSetting').value);if(!Number.isFinite(n)||n<.2||n>20){toast('Finder field must be 0.2–20°');return}settings.navigation.finderFovDeg=String(n);saveSettings();toast('Finder field saved')};document.getElementById('addScope').onclick=()=>{const id='scope-'+Date.now();eq.telescopes.push({id,name:'New telescope',apertureMm:'',focalLengthMm:'',type:'Reflector'});eq.activeTelescopeId=id;saveSettings();renderEquipment()};document.getElementById('addEyepiece').onclick=()=>{const name=document.getElementById('epName').value.trim(),f=document.getElementById('epFocal').value,af=document.getElementById('epAfov').value;if(!num(f)){toast('Enter an eyepiece focal length');return}eq.eyepieces.push({id:'ep-'+Date.now(),name:name||`${f} mm eyepiece`,focalLengthMm:f,apparentFovDeg:af});saveSettings();renderEquipment()};document.querySelectorAll('[data-delete-ep]').forEach(b=>b.onclick=()=>{eq.eyepieces=eq.eyepieces.filter(ep=>ep.id!==b.dataset.deleteEp);saveSettings();renderEquipment()})}
function scopeMathSummary(scope){const a=num(scope.apertureMm),f=num(scope.focalLengthMm);if(!a||!f)return`<div class="notice" style="margin-top:16px">Add the telescope focal length to unlock focal ratio, magnification, exit pupil, and field-of-view calculations.</div>`;return`<div class="calcGrid"><div class="calcBox"><span>Focal ratio</span><strong>f/${(f/a).toFixed(1)}</strong></div><div class="calcBox"><span>Aperture</span><strong>${a.toFixed(0)} mm</strong></div><div class="calcBox"><span>Focal length</span><strong>${f.toFixed(0)} mm</strong></div><div class="calcBox"><span>Rule-of-thumb max</span><strong>~${Math.round(a*2)}×</strong></div></div><p class="eqNote">The ~2× aperture-in-mm maximum is only a rough upper limit; seeing and optical quality often set a lower useful magnification.</p>`}
function eyepieceRow(scope,ep){const m=eyepieceMath(scope,ep);return`<div class="equipmentRow"><div><strong>${esc(ep.name)}</strong><br><span>${esc(ep.focalLengthMm)} mm · ${esc(ep.apparentFovDeg||'—')}° AFOV</span></div><div><span>Magnification</span><br><strong>${m?m.mag.toFixed(0)+'×':'—'}</strong></div><div><span>Exit pupil</span><br><strong>${m?m.exit.toFixed(2)+' mm':'—'}</strong></div><div><span>True field</span><br><strong>${m&&m.trueFov?m.trueFov.toFixed(2)+'°':'—'}</strong></div><button class="miniButton" data-delete-ep="${esc(ep.id)}">Remove</button></div>`}

const PHOTO_DB_NAME='astronomy-companion-observation-media';
const PHOTO_STORE='photos';
let observationPendingPhotos=[];
let observationRemovedPhotoIds=new Set();
let observationPhotoContext='';
let observationPhotoUrls=[];
function cleanupObservationPhotoUrls(){for(const u of observationPhotoUrls)URL.revokeObjectURL(u);observationPhotoUrls=[]}
function openPhotoDb(){return new Promise((resolve,reject)=>{if(!('indexedDB'in window)){reject(new Error('IndexedDB unavailable'));return}const req=indexedDB.open(PHOTO_DB_NAME,1);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(PHOTO_STORE)){const st=db.createObjectStore(PHOTO_STORE,{keyPath:'id'});st.createIndex('observationId','observationId',{unique:false})}};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error||new Error('Could not open photo storage'))})}
async function photoDbPut(rec){const db=await openPhotoDb();return new Promise((resolve,reject)=>{const tx=db.transaction(PHOTO_STORE,'readwrite');tx.objectStore(PHOTO_STORE).put(rec);tx.oncomplete=()=>{db.close();resolve(true)};tx.onerror=()=>{db.close();reject(tx.error)}})}
async function photoDbGet(id){const db=await openPhotoDb();return new Promise((resolve,reject)=>{const tx=db.transaction(PHOTO_STORE,'readonly'),req=tx.objectStore(PHOTO_STORE).get(id);req.onsuccess=()=>{db.close();resolve(req.result||null)};req.onerror=()=>{db.close();reject(req.error)}})}
async function photoDbDelete(id){try{const db=await openPhotoDb();await new Promise((resolve,reject)=>{const tx=db.transaction(PHOTO_STORE,'readwrite');tx.objectStore(PHOTO_STORE).delete(id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});db.close()}catch(e){console.warn('Photo delete failed',e)}}
async function photoDbDeleteObservation(observationId){try{const db=await openPhotoDb();await new Promise((resolve,reject)=>{const tx=db.transaction(PHOTO_STORE,'readwrite'),idx=tx.objectStore(PHOTO_STORE).index('observationId'),req=idx.openCursor(IDBKeyRange.only(observationId));req.onsuccess=()=>{const c=req.result;if(c){c.delete();c.continue()}};tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});db.close()}catch(e){console.warn('Photo cleanup failed',e)}}
function photoFileOkay(file){return file&&String(file.type||'').startsWith('image/')}
function photoThumbHtml(id,removable=false,pending=false){return `<div class="obsPhotoThumb" data-photo-slot="${esc(id)}"><div class="obsPhotoLoading">Loading photo…</div>${removable?`<button type="button" title="Remove photo" data-photo-remove="${esc(id)}" data-photo-pending="${pending?'1':'0'}">×</button>`:''}</div>`}
async function fillPhotoSlot(id,slot,clickable=true){try{const rec=await photoDbGet(id);if(!rec||!rec.blob){slot.innerHTML='<div class="obsPhotoLoading">Photo unavailable</div>';return}const url=URL.createObjectURL(rec.blob);observationPhotoUrls.push(url);const img=document.createElement('img');img.src=url;img.alt=rec.name||'Observation photo';img.title=rec.name||'Observation photo';if(clickable)img.onclick=()=>openPhotoLightbox(rec,url);slot.querySelector('.obsPhotoLoading')?.replaceWith(img)}catch(e){slot.querySelector('.obsPhotoLoading')?.replaceWith(Object.assign(document.createElement('div'),{className:'obsPhotoLoading',textContent:'Photo storage unavailable'}))}}
function openPhotoLightbox(rec,url){let box=document.getElementById('photoLightbox');if(!box){box=document.createElement('div');box.id='photoLightbox';box.className='photoLightbox';box.hidden=true;box.innerHTML='<button class="photoLightboxClose" aria-label="Close">×</button><img alt="Observation photo"><div class="photoLightboxMeta"></div>';document.body.appendChild(box);box.querySelector('.photoLightboxClose').onclick=()=>box.hidden=true;box.onclick=e=>{if(e.target===box)box.hidden=true}}box.querySelector('img').src=url;box.querySelector('.photoLightboxMeta').textContent=`${rec.name||'Observation photo'}${rec.size?` · ${(rec.size/1024/1024).toFixed(1)} MB`:''}`;box.hidden=false}
async function hydrateObservationPhotos(logs){for(const x of logs){const ids=Array.isArray(x.photoIds)?x.photoIds:[],wrap=document.querySelector(`[data-obs-photo-gallery="${CSS.escape(x.id)}"]`);if(!wrap)continue;if(!ids.length){wrap.innerHTML='';continue}wrap.innerHTML=ids.map(id=>photoThumbHtml(id,false,false)).join('');for(const id of ids){const slot=wrap.querySelector(`[data-photo-slot="${CSS.escape(id)}"]`);if(slot)fillPhotoSlot(id,slot,true)}}}
function renderPendingPhotoPreview(){const wrap=document.getElementById('obsPhotoPreview');if(!wrap)return;const existingIds=(settings.observations.find(x=>x.id===observationEditingId)?.photoIds||[]).filter(id=>!observationRemovedPhotoIds.has(id));wrap.innerHTML=existingIds.map(id=>photoThumbHtml(id,true,false)).join('')+observationPendingPhotos.map((p,i)=>`<div class="obsPhotoThumb" data-pending-slot="${i}"><img alt="${esc(p.name)}"><button type="button" title="Remove photo" data-photo-remove="${i}" data-photo-pending="1">×</button></div>`).join('');for(const id of existingIds){const slot=wrap.querySelector(`[data-photo-slot="${CSS.escape(id)}"]`);if(slot)fillPhotoSlot(id,slot,true)}observationPendingPhotos.forEach((p,i)=>{const slot=wrap.querySelector(`[data-pending-slot="${i}"] img`);if(slot){const url=URL.createObjectURL(p);observationPhotoUrls.push(url);slot.src=url;slot.onclick=()=>openPhotoLightbox({name:p.name,size:p.size},url)}});wrap.querySelectorAll('[data-photo-remove]').forEach(b=>b.onclick=()=>{if(b.dataset.photoPending==='1'){observationPendingPhotos.splice(Number(b.dataset.photoRemove),1)}else observationRemovedPhotoIds.add(b.dataset.photoRemove);cleanupObservationPhotoUrls();renderPendingPhotoPreview()})}

function renderObservations(){
cleanupObservationPhotoUrls();
const logs=Array.isArray(settings.observations)?settings.observations:[];
const editing=observationEditingId?logs.find(x=>x.id===observationEditingId):null;
const photoContext=editing?.id||`new:${observationDraftObjectKey||selectedObjectKey||''}`;
if(observationPhotoContext!==photoContext){observationPhotoContext=photoContext;observationPendingPhotos=[];observationRemovedPhotoIds=new Set()}
const defaultObj=editing?null:(observationDraftObjectKey?catalogObject(observationDraftObjectKey):catalogObject(selectedObjectKey));
const now=new Date(),dt=editing?.dateTime||toLocalDateTimeValue(now),loc=editing?.locationName||settings.locationName||'',scope=settings.equipment.telescopes.find(s=>s.id===(editing?.telescopeId||settings.equipment.activeTelescopeId))||settings.equipment.telescopes[0];
const objectName=editing?observationObjectLabel(editing.objectKey,editing.objectName):(defaultObj?objectDisplayName(defaultObj):'');
const filtered=logs.slice().sort((a,b)=>new Date(b.dateTime)-new Date(a.dateTime)).filter(x=>{const q=observationFilter.trim().toLowerCase();if(!q)return true;return[observationObjectLabel(x.objectKey,x.objectName),x.locationName,x.telescopeName,x.eyepieceName,x.notes].some(v=>String(v||'').toLowerCase().includes(q))});
const unique=new Set(logs.map(x=>observationObjectLabel(x.objectKey,x.objectName))).size;
const common=(()=>{const c={};for(const x of logs){const k=observationObjectLabel(x.objectKey,x.objectName);c[k]=(c[k]||0)+1}return Object.entries(c).sort((a,b)=>b[1]-a[1])[0]?.[0]||'—'})();
const totalPhotos=logs.reduce((n,x)=>n+(Array.isArray(x.photoIds)?x.photoIds.length:0),0);
document.getElementById('page').innerHTML=`<section class="pageStack"><div class="obsHeader"><div><p class="eyebrow">OFFLINE OBSERVING LOG</p><h3>Observations</h3><p class="mutedText">Record what you saw, your equipment and conditions, and attach photos from the scope or your phone. Logs and photos stay offline on this computer.</p></div><div class="inlineActions"><button class="secondaryButton" id="obsExportCsv">Export CSV</button><button class="secondaryButton" id="obsExportJson">Export JSON</button></div></div><div class="obsStats"><div class="obsStat"><span>Observations</span><strong>${logs.length}</strong></div><div class="obsStat"><span>Unique objects</span><strong>${unique}</strong></div><div class="obsStat"><span>Photos</span><strong>${totalPhotos}</strong></div></div><div class="obsLayout"><section class="obsCard"><p class="eyebrow">${editing?'EDIT ENTRY':'NEW ENTRY'}</p><h3>${editing?'Edit observation':'Log what you saw'}</h3><div class="obsForm"><label class="wide">Object<input id="obsObject" value="${esc(objectName)}" placeholder="Saturn, M31, Vega..." autocomplete="off"><div id="obsObjectSuggestions" class="obsObjectSuggestions"></div></label><label>Date & time<input id="obsDateTime" type="datetime-local" value="${esc(dt)}"></label><label>Location<input id="obsLocation" value="${esc(loc)}" placeholder="Home, Farm, dark site..."></label><label>Telescope<select id="obsScope"><option value="">— none / naked eye —</option>${settings.equipment.telescopes.map(s=>`<option value="${esc(s.id)}" ${(editing?.telescopeId||scope?.id)===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></label><label>Eyepiece<select id="obsEyepiece"><option value="">— none —</option>${settings.equipment.eyepieces.map(e=>`<option value="${esc(e.id)}" ${editing?.eyepieceId===e.id?'selected':''}>${esc(e.name)}</option>`).join('')}</select></label><label>Seeing<select id="obsSeeing">${[1,2,3,4,5].map(n=>`<option value="${n}" ${(editing?.seeing||3)==n?'selected':''}>${n} / 5</option>`).join('')}</select></label><label>Transparency<select id="obsTransparency">${[1,2,3,4,5].map(n=>`<option value="${n}" ${(editing?.transparency||3)==n?'selected':''}>${n} / 5</option>`).join('')}</select></label><label>Conditions<select id="obsConditions">${['Clear','Mostly clear','Partly cloudy','Hazy','Thin clouds','Windy','Other'].map(v=>`<option ${editing?.conditions===v?'selected':''}>${v}</option>`).join('')}</select></label><label>Overall view<select id="obsRating"><option value="0">Not rated</option>${[1,2,3,4,5].map(n=>`<option value="${n}" ${editing?.rating==n?'selected':''}>${observationStars(n)} ${n}/5</option>`).join('')}</select></label><label class="wide">Notes<textarea id="obsNotes" placeholder="What did it look like? Color, detail, difficulty, best magnification, anything unusual...">${esc(editing?.notes||'')}</textarea></label><div class="wide obsPhotoPicker"><strong>Photos</strong><input id="obsPhotos" type="file" accept="image/*" multiple><small>Add one or several photos. Original image files are kept in offline browser storage, so they do not use the small settings quota.</small><div id="obsPhotoPreview" class="obsPhotoGrid"></div><div class="obsPhotoStorageNote">Common JPEG, PNG and WebP images work best. HEIC support depends on your Windows/browser image codecs.</div></div></div><div class="inlineActions" style="margin-top:14px"><button class="primaryButton" id="obsSave">${editing?'Save changes':'Add observation'}</button>${editing?'<button class="secondaryButton" id="obsCancelEdit">Cancel</button>':''}<button class="secondaryButton" id="obsUseCurrent">Use current Finder object</button></div></section><section class="obsCard"><div class="obsSearch"><label><span class="fieldLabel">Search log</span><input id="obsFilter" value="${esc(observationFilter)}" placeholder="Object, location, notes..."></label><span class="mutedText">${filtered.length} shown</span></div><div class="obsList" style="margin-top:12px">${filtered.length?filtered.map(x=>`<article class="obsEntry"><div class="obsEntryTop"><div><h4>${esc(observationObjectLabel(x.objectKey,x.objectName))}</h4><div class="obsEntryMeta">${esc(formatObservationDate(x.dateTime))}${x.locationName?' · '+esc(x.locationName):''}<br>${x.telescopeName?esc(x.telescopeName):'No telescope'}${x.eyepieceName?' · '+esc(x.eyepieceName):''}${x.magnification?' · '+esc(x.magnification)+'×':''}<br>Seeing ${esc(x.seeing||'—')}/5 · Transparency ${esc(x.transparency||'—')}/5${x.conditions?' · '+esc(x.conditions):''}</div>${Array.isArray(x.photoIds)&&x.photoIds.length?`<span class="photoCount">📷 ${x.photoIds.length} photo${x.photoIds.length===1?'':'s'}</span>`:''}</div><div class="obsRating" title="Overall view">${Number(x.rating)>0?observationStars(x.rating):'—'}</div></div>${x.notes?`<p class="obsEntryNotes">${esc(x.notes)}</p>`:''}<div class="obsEntryPhotos" data-obs-photo-gallery="${esc(x.id)}"></div><div class="obsActions"><button class="miniButton" data-obs-edit="${esc(x.id)}">Edit</button><button class="miniButton" data-obs-open="${esc(x.objectKey||'')}">Find object</button><button class="miniButton" data-obs-delete="${esc(x.id)}">Delete</button></div></article>`).join(''):`<div class="emptyLog"><strong>No observations yet.</strong><br>Log your first target on the left.</div>`}</div></section></div></section>`;
const objectInput=document.getElementById('obsObject'),suggestions=document.getElementById('obsObjectSuggestions');
let chosenObjectKey=editing?.objectKey||defaultObj?.key||'';
function updateSuggestions(){const q=objectInput.value.trim();if(!q){suggestions.classList.remove('show');suggestions.innerHTML='';return}const list=searchObjects(q,'all').slice(0,8);suggestions.innerHTML=list.map(o=>`<button type="button" data-obs-suggest="${esc(o.key)}"><strong>${esc(objectDisplayName(o))}</strong><br><small>${esc(objectSubtitle(o))}</small></button>`).join('');suggestions.classList.toggle('show',list.length>0);suggestions.querySelectorAll('[data-obs-suggest]').forEach(b=>b.onclick=()=>{const o=catalogObject(b.dataset.obsSuggest);chosenObjectKey=o.key;objectInput.value=objectDisplayName(o);suggestions.classList.remove('show')})}
objectInput.oninput=()=>{chosenObjectKey='';updateSuggestions()};objectInput.onfocus=updateSuggestions;
document.getElementById('obsUseCurrent').onclick=()=>{const o=catalogObject(selectedObjectKey);chosenObjectKey=o.key;objectInput.value=objectDisplayName(o);suggestions.classList.remove('show')};
document.getElementById('obsPhotos').onchange=e=>{for(const f of Array.from(e.target.files||[])){if(photoFileOkay(f))observationPendingPhotos.push(f)}e.target.value='';cleanupObservationPhotoUrls();renderPendingPhotoPreview()};
renderPendingPhotoPreview();hydrateObservationPhotos(filtered);
document.getElementById('obsSave').onclick=async()=>{let obj=chosenObjectKey?catalogObject(chosenObjectKey):observationObjectFromText(objectInput.value);const dateTime=document.getElementById('obsDateTime').value;if(!objectInput.value.trim()){toast('Enter an object');return}if(!dateTime){toast('Enter a date and time');return}const scopeId=document.getElementById('obsScope').value,epId=document.getElementById('obsEyepiece').value,s=settings.equipment.telescopes.find(x=>x.id===scopeId),ep=settings.equipment.eyepieces.find(x=>x.id===epId);let mag='';if(s&&ep){const m=eyepieceMath(s,ep);if(m)mag=String(Math.round(m.mag))}const entryId=editing?.id||'obs-'+Date.now();let photoIds=(Array.isArray(editing?.photoIds)?editing.photoIds:[]).filter(id=>!observationRemovedPhotoIds.has(id));try{for(const id of observationRemovedPhotoIds)await photoDbDelete(id);for(const file of observationPendingPhotos){const id=`photo-${Date.now()}-${Math.random().toString(36).slice(2,9)}`;await photoDbPut({id,observationId:entryId,name:file.name||'Observation photo',type:file.type||'application/octet-stream',size:file.size||0,blob:file,createdAt:new Date().toISOString()});photoIds.push(id)}}catch(err){console.error(err);toast('Could not save one or more photos');return}const entry={id:entryId,objectKey:obj?.key||'',objectName:obj?objectDisplayName(obj):objectInput.value.trim(),dateTime,locationName:document.getElementById('obsLocation').value.trim(),latitude:settings.latitude,longitude:settings.longitude,telescopeId:s?.id||'',telescopeName:s?.name||'',eyepieceId:ep?.id||'',eyepieceName:ep?.name||'',magnification:mag,seeing:Number(document.getElementById('obsSeeing').value),transparency:Number(document.getElementById('obsTransparency').value),conditions:document.getElementById('obsConditions').value,rating:Number(document.getElementById('obsRating').value),notes:document.getElementById('obsNotes').value.trim(),photoIds,updatedAt:new Date().toISOString(),createdAt:editing?.createdAt||new Date().toISOString()};if(editing){settings.observations=settings.observations.map(x=>x.id===editing.id?entry:x)}else settings.observations.push(entry);saveSettings();observationEditingId='';observationDraftObjectKey='';observationPhotoContext='';observationPendingPhotos=[];observationRemovedPhotoIds=new Set();toast(editing?'Observation updated':'Observation saved');renderObservations()};

document.querySelectorAll('[data-obs-edit]').forEach(b=>b.onclick=()=>{observationEditingId=b.dataset.obsEdit;observationPhotoContext='';renderObservations()});
document.querySelectorAll('[data-obs-delete]').forEach(b=>b.onclick=async()=>{const x=settings.observations.find(o=>o.id===b.dataset.obsDelete);if(confirm(`Delete observation of ${observationObjectLabel(x?.objectKey,x?.objectName)} and its attached photos?`)){await photoDbDeleteObservation(b.dataset.obsDelete);settings.observations=settings.observations.filter(o=>o.id!==b.dataset.obsDelete);saveSettings();if(observationEditingId===b.dataset.obsDelete)observationEditingId='';renderObservations()}});

document.getElementById('obsExportCsv').onclick=()=>{const cols=['dateTime','objectName','locationName','telescopeName','eyepieceName','magnification','seeing','transparency','conditions','rating','photoCount','notes'];const rows=[cols.join(','),...settings.observations.slice().sort((a,b)=>new Date(a.dateTime)-new Date(b.dateTime)).map(x=>cols.map(c=>csvCell(c==='objectName'?observationObjectLabel(x.objectKey,x.objectName):c==='photoCount'?(x.photoIds||[]).length:x[c])).join(','))];downloadText('astronomy-observations.csv',rows.join('\n'),'text/csv')};
}
function renderSettings(){const o=parseObserver();document.getElementById('page').innerHTML=`<section class="settingsCard"><div class="settingsHeading"><div><h3>Observing location</h3><p>Saved locally on this computer. Longitude is negative west of Greenwich.</p></div><span class="validationBadge ${o?'valid':''}">${o?'Valid location':'Location incomplete'}</span></div><div class="fieldGrid"><label>Location name<input id="locName" value="${esc(settings.locationName)}" placeholder="Home or Farm"></label><label>Latitude<input id="lat" inputmode="decimal" value="${esc(settings.latitude)}" placeholder="36.0000"></label><label>Longitude<input id="lon" inputmode="decimal" value="${esc(settings.longitude)}" placeholder="-86.0000"></label><label>Elevation (m)<input id="elev" inputmode="decimal" value="${esc(settings.elevationM)}" placeholder="0"></label></div><div class="inlineActions"><button class="secondaryButton" id="saveLocation">Save location</button><button class="secondaryButton" id="geoButton">Use device location</button><button class="secondaryButton" id="fullscreenButton">Fullscreen</button><span id="geoMsg" class="mutedText"></span></div><div class="settingsDivider"></div><h3>Offline catalog</h3><p>v0.7.2 contains the solar-system engine, ${BRIGHT_STARS.length} bright stars, 110 Messier entries, constellation guide segments, the all-sky map, Push-To guidance, and two-star sensor alignment inside the app file itself.</p><div class="notice">Press <span class="kbd">N</span> anywhere in the app to switch night vision on or off. Press <span class="kbd">O</span> to open Observations. Theme, brightness, location, telescope profiles, eyepieces, alignment, observation logs, and attached photos are stored locally.</div><div class="settingsDivider"></div><h3>Data</h3><div class="inlineActions"><button class="secondaryButton" id="exportSettings">Export settings</button><button class="secondaryButton" id="resetSettings">Reset app settings</button></div></section>`;document.getElementById('saveLocation').onclick=()=>{settings.locationName=document.getElementById('locName').value;settings.latitude=document.getElementById('lat').value;settings.longitude=document.getElementById('lon').value;settings.elevationM=document.getElementById('elev').value;saveSettings();toast('Location saved');renderShell()};document.getElementById('geoButton').onclick=()=>{const msg=document.getElementById('geoMsg');if(!navigator.geolocation){msg.textContent='Geolocation is not available in this launch mode.';return}msg.textContent='Requesting location…';navigator.geolocation.getCurrentPosition(pos=>{settings.latitude=pos.coords.latitude.toFixed(6);settings.longitude=pos.coords.longitude.toFixed(6);if(pos.coords.altitude!=null)settings.elevationM=String(Math.round(pos.coords.altitude));saveSettings();msg.textContent='Location captured.';renderShell()},err=>msg.textContent='Could not get location: '+err.message,{enableHighAccuracy:true,timeout:12000,maximumAge:60000})};document.getElementById('fullscreenButton').onclick=()=>document.documentElement.requestFullscreen?.();document.getElementById('exportSettings').onclick=()=>{const blob=new Blob([JSON.stringify(settings,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='astronomy-companion-v0.7.2-settings.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};document.getElementById('resetSettings').onclick=()=>{if(confirm('Reset Astronomy Companion settings on this computer?')){settings=deepClone(DEFAULT_SETTINGS);saveSettings();renderShell()}}}
window.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))return;if(e.key==='n'||e.key==='N'){settings.theme=settings.theme==='night'?'day':'night';saveSettings();renderShell()}else if(e.key==='s'||e.key==='S'){page='Sky Map';renderShell()}else if(e.key==='p'||e.key==='P'){page='Push-To';renderShell()}else if(e.key==='a'||e.key==='A'){page='Alignment';renderShell()}else if(e.key==='o'||e.key==='O'){page='Observations';renderShell()}else if(page==='Sky Map'&&e.key==='['){skyMapRotationDeg=normalizeHeading(skyMapRotationDeg-15);renderSkyMap()}else if(page==='Sky Map'&&e.key===']'){skyMapRotationDeg=normalizeHeading(skyMapRotationDeg+15);renderSkyMap()}});
window.addEventListener('error',e=>{console.error(e.error||e.message);const p=document.getElementById('page');if(p)p.insertAdjacentHTML('afterbegin',`<div class="notice error">Something went wrong while calculating the sky. Reload the app or check the saved values.</div>`)});
renderShell();
</script></body></html>
