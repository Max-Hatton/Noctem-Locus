[package]
name = "astronomy-companion"
version = "0.3.0"
description = "Offline-first astronomy observing companion"
authors = ["Astronomy Companion"]
edition = "2021"

[lib]
name = "astronomy_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
